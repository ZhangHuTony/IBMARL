# Balance environment configuration

#Inherit from the base configuration
extends: "../base.yaml"

# Environment specific parameters
n_agents: 3
horizon: 300         # matches the R2BC recording horizon for the balance demos

# horizon 300 against base.yaml's frames_per_batch 1000 gives 3 parallel VMAS sub-envs
# (navigation gets 10) and a 900-vs-1000 frames-per-batch mismatch.  3000 restores 10
# sub-envs; load_config merges this before computing total_frames.
frames_per_batch: 3000

# The balance demos carry raw dense VMAS rewards, so train dense to keep one reward
# scale in the replay buffer.  Flip to True (or pass --sparse) to route through
# the native package-on-goal sparse scenario -- but relabel the demo rewards first.
sparse_rewards: True
