# Balance environment configuration

#Inherit from the base configuration
extends: "../base.yaml"

# Environment specific parameters
n_agents: 3          # VMAS default; make_env passes no kwargs for balance
horizon: 300         # fixed episode length; matches the R2BC recording horizon of the demos

# horizon 300 against base.yaml's frames_per_batch 1000 gives 3 parallel VMAS sub-envs
# (navigation gets 10) and a 900-vs-1000 frames-per-batch mismatch.  3000 restores 10
# sub-envs; load_config merges this before computing total_frames.
frames_per_batch: 3000
# 500 iterations x 3000 frames = 1.5M frames: the budget ibmarl_balance.yaml's replay-size
# reasoning assumes (the ring wraps at iter 333/500 at 1M).  Pinned HERE because
# load_config freezes total_frames right after this layer (run_experiment.py:43), so an
# experiment overlay could not move it.  rft_balance.yaml's bc_anneal_n_iters must equal it.
n_iters: 500

# --- Reward schema: gt-in-radius sparse (balance1 sweep, 2026-10) ---------------------
# The native VMAS reward (100 x the per-step decrease in package-goal distance, -10 on
# floor contact) is paid only while the package is within gt_radius of the goal; every
# other step pays -1 (transforms/balance_sparse.py).  The same family as CONTEXT.md's
# "Sparse Navigation": a return reads as -(steps off-goal) plus the shaping earned inside.
# NOT the binary terminal schema (navigation/buzz_wire); balance has no such branch.
sparse_rewards: True
# VMAS ends a balance episode when the line/package touches the floor or the package
# overlaps the goal.  Under -1/step that terminal is a suicide incentive (a fall at step 5
# costs -5, carrying the package off-goal for 300 steps costs -300) and it is not the MDP
# the demos were recorded in (36 x exactly 300 steps).  True = every episode runs the
# full horizon (scenarios/balance_fixed_horizon.py); False = VMAS's own termination.
suppress_done: True
# Basin radius.  PROVISIONAL: the balance1 batch pins this from
# analysis/balance_teacher_audit.py -- the smallest radius in {0.3, 0.5, 0.75, 1.05} at
# which the bundled teacher reaches the basin in 40-60% of episodes (buzz-wire's teacher
# sits at 0.49).  Goal y ~ U[0,1] and the package starts at y ~ -0.89, so the initial
# distance is >= ~0.9 and 1.05 is loose.  analysis/relabel_demos_sparse.py reads this
# value, so the demos (teachers/balance/demonstrations_sparse.pt) must be re-relabelled
# whenever it changes.  Audit result: <fill in during Phase C>.
gt_radius: 1.05

# Evaluation.  The default (every iteration, 2 protocols x 2 rollouts of the 10-sub-env
# batch for 20 episodes) costs ~70% of the wall time on transport; every 2nd iteration on
# a 40-sub-env eval env (one rollout per protocol) gives 250 points per run instead.
eval_interval: 2
eval_episodes: 40
