# Buzz-wire environment configuration (sparse binary-terminal variant via
# SparseRewardBuzzWireScenario - see src/environment/scenarios/buzz_wire_sparse.py)

#Inherit from the base configuration
extends: "../base.yaml"

# Environment specific parameters
n_agents: 2
horizon: 200
# 40 VMAS sub-envs x 200 steps (num_vmas_env = frames_per_batch // horizon).
# Must live in this file: load_config computes total_frames = frames_per_batch *
# n_iters right after the environment merge. 8000 x 75 iters = 600k env steps --
# the same budget as the 2000 x 300 pilot, collected in 4x fewer sequential
# batched steps. The GPU is launch-bound here: a batched step costs the same at
# 10, 20, 40 or 80 sub-envs (measured 67.0/67.4/67.4/67.0 ms), so widening the
# batch is very nearly free wall-time.
frames_per_batch: 8000
n_iters: 75
# Replay capacity for EVERY method on this task.  base.yaml's 1,000,000 never
# wraps over the 600k-frame budget, while IBMARL's ibmarl_replay_size (400k,
# ibmarl_buzz_wire.yaml) evicts from iteration 50 -- an uncontrolled difference
# between the arms in buzzwire4, and one that matters here: the baselines'
# critics kept old successes in a never-evicting buffer while their actors
# drifted, with Q climbing past the schema's hard ceiling of 1 (RLfD reached
# 1.6) before every seed collapsed.  Same 400k window for all, so the buffer is
# no longer a variable.  ibmarl_replay_size stays equal to this.
memory_size: 400000
# Evaluate every 2nd iteration (plus the final one) = 38 evals over 600k steps.
# buzzwire4 evaluated every 4th: with a 0.775 teacher every IBMARL arm crossed
# it within 8-16 iterations, and a 4-iteration (32k-step) cadence put three of
# the four arms within one eval interval of each other -- unresolvable by
# construction.  One eval is ~92 s for IBMARL's two protocols (measured from
# buzzwire4's elapsed_time), so 19 extra evals cost ~30 min per run (~20%).
eval_interval: 2
# Sub-envs in the dedicated eval env, i.e. episodes per evaluation.  Without
# this the eval env mirrors the training batch (40 sub-envs) and evaluate()'s
# n_episodes=20 rounds up to ONE rollout = 40 episodes = +/-0.126 at 2 sigma on
# a success rate -- the noise buzzwire4's curves are made of, and why bc_eval
# ranked a 0.770 teacher above a 0.882 one.  200 gives +/-0.057.  It is a wider
# batch, not more rollouts: the GPU is launch-bound (see frames_per_batch), so
# 200 sub-envs step in about the time 40 do.  Read by BaseMARLExperiment.eval_env.
eval_episodes: 200
# Sparse basin radius on ||ball - goal||: 10x the native success predicate
# (0.01), below the corridor half-width (0.125) so "inside" means "at the goal".
# Baked into the recorded demonstration rewards - changing it requires
# re-collecting demos in R2BC with the matching threshold.
gt_radius: 0.1

# UTD parity with the pilot: 8000 frames/iter x 0.25 = 2000 optimiser steps,
# i.e. 75 x 2000 = 150,000 total gradient steps, identical to 300 x 500. The
# learner is deliberately untouched otherwise (train_batch_size 1024,
# polyak_tau 0.001 stepped once per optimiser step) -- widening the batch would
# have cut the number of updates and the pilot only took off after ~50k of them.
training:
  n_optimiser_steps: 2000

# Binary terminal reward (src/environment/scenarios/buzz_wire_sparse.py):
# +1 to both agents once, on the first step the ball is within gt_radius of the
# goal, and the episode terminates there; 0 on every other step, truncating at
# `horizon` (StepCounter) with the critic bootstrapping through the time limit.
# Wire/floor contact terminates with 0 -- the buzz-wire rule; without it a
# constant push drifts the ball along the walls into the basin (~40% of
# episodes) and an untrained actor scores ~0.95.  Lives here because it is the
# task definition.  The bundled demos were recorded under the legacy -1/step schema
# and relabelled offline (analysis/relabel_demos_binary.py).
binary_terminal_reward: False
