# IBRL-style single replay buffer (demos + online in one buffer, no annealing)
ibmarl_replay_size: 200000       # single buffer capacity in transitions
ibmarl_min_warm_up_frames: 5000  # collect this many frames before training starts

strict : False #choose best combinatoion of policies or better policy actions

soft : True
temperature: 0.05

# Size of the critic ensemble. All members are trained; the arbiter samples 2 at
# random and takes their min as a pessimistic Q-estimate. Set to 1 to disable the
# ensemble and fall back to a single critic (RLFD parity).
num_critics: 3

# Exploration noise parameters
exploration_noise:
  sigma_init: 0.1  # Initial Gaussian noise standard deviation for exploration
  sigma_end: 0.1   # Final Gaussian noise standard deviation (after annealing)