# IBRL-style single replay buffer (demos + online in one buffer, no annealing)
ibmarl_replay_size: 200000       # single buffer capacity in transitions
ibmarl_min_warm_up_frames: 5000  # collect this many frames before training starts
# Who acts during warm-up: "arbiter" (the untrained critic arbitrates; the
# historical default, what every navigation run used) or "teacher" (IBRL's
# warm-up -- the teacher's noised proposal is executed until the buffer holds
# ibmarl_min_warm_up_frames).  buzz_wire overrides this; see its overlay.
ibmarl_warm_up_policy: arbiter

strict : False #choose best combinatoion of policies or better policy actions

soft : True
# 0.0005 = 0.05 x (1 - gamma).  Under binary_terminal_reward every Q-gap between
# the teacher's and the RL actor's proposals is (1 - gamma) times what it was
# under the legacy -1/step schema (old |dQ/dT| ~ gamma^T, new ~ gamma^T (1-gamma),
# per agent, for every T and state), so this keeps the Boltzmann selection where
# 0.05 had it: measured median gap 0.347 today, decisive (>0.9) in 80% of
# decisions.  Left at 0.05 the new median gap (~0.0035) gives p ~ 0.52, a coin
# flip at every decision.  Balance/transport still run the legacy schema and pin
# 0.05 in their overlays.
temperature: 0.0005

# Size of the critic ensemble. All members are trained; the arbiter samples 2 at
# random and takes their min as a pessimistic Q-estimate. Set to 1 to disable the
# ensemble and fall back to a single critic (RLFD parity).
num_critics: 3

# Exploration noise parameters
exploration_noise:
  sigma_init: 0.1  # Initial Gaussian noise standard deviation for exploration
  sigma_end: 0.1   # Final Gaussian noise standard deviation (after annealing)

# --- Evaluation protocol -------------------------------------------------
# `eval_reward_mean` measures the arbitrated RL+IL policy (greedy: the critic
# picks between the teacher's and the RL actor's action, no exploration noise),
# matching IBRL's evaluation.  The RL actors alone are measured on a second,
# seed-paired rollout set and logged as `rl_only_episode_reward_mean`; set this
# to false to skip it and halve evaluation cost where that matters.
eval_rl_only: true

# Ensemble reduction on the evaluation (greedy) path only.  min_all takes the
# min over every critic -- deterministic, the limit of training's min over a
# random 2.  min_pair uses a fixed pair instead, reproducing the training-time
# operator's subset size exactly while staying deterministic.
eval_critic_reduction: min_all

# --- Gated imitation term (actor regulariser) ----------------------------
# Off by default: with mode `none` the actor loss is the plain MADDPG term
# and no new code runs.  `gated` adds alpha * mean|Q_tot| * gate(o) *
# ||pi_theta(o) - pi_teacher(o)||^2 to the actor loss, where gate(o) is the
# arbiter's preference for the teacher's proposal at o (two pure joint
# candidates scored by the target ensemble exactly as at execution).
# `uniform` holds the gate open (the RFT-like control).  alpha is in units
# of the minibatch mean |Q_tot| (TD3+BC-style), so it transfers across
# tasks with different return scales.
actor_reg:
  mode: none        # none | gated | uniform
  alpha: 0.4        # 0.4 == TD3+BC's default ratio in this parametrisation
  gate: soft        # soft (Boltzmann at `temperature`) | hard (indicator)
  temperature: 0.0005 # soft-gate temperature; the arbiter's own (rescaled with it, see above)
