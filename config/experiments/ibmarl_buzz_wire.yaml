# Buzz-wire-specific overlay for IBMARL.
# Merged on top of config/experiments/ibmarl.yaml by load_config, so everything not
# named here (strict/soft/temperature/num_critics/exploration_noise/warm-up) keeps
# its default.

# R2BC teacher distilled from the tuned SimpleBuzzwireHeuristic demonstrator
# (target_x 0.5, gain 4.0): 6 demonstrations, 1,200 transitions, collected with
# gt_radius 0.1 on a fixed 200-step horizon.
#
# DELIBERATELY WEAKENED from the 12-demo teacher used through buzzwire3, to open
# headroom for the RL side: 0.770 success against 0.882, i.e. 23 points of room
# to improve instead of 12.
#
# Teacher level: 0.770 +/- 0.021 over 400 freshly-drawn episodes (2026-09-20).
#
# WARNING -- bc_eval will NOT report that number.  Its eval env is fixed-seed
# and yields exactly 40 episodes (n_episodes 20 vs n_envs 40 means
# n_rollouts = ceil(20/40) = 1), and on that particular draw this teacher
# scores 0.875 while the 12-demo teacher it replaced scores 0.850 -- i.e. the
# protocol ranks the weakened teacher ABOVE the stronger one.  Separating
# 0.770 from 0.882 at 2 sigma needs ~90 episodes; 40 gives +/-0.126.  The
# weakening is real and the RL side does face it (warm-up and arbitration run
# on freshly-seeded envs, not the eval set), but the reference line printed
# next to the learning curves is not measuring it.  Raise the eval episode
# count before reading any buzz_wire result as a success rate.
#
# Demo-count curve under the BINARY TERMINAL schema, seed 0, 400-episode
# bc_eval per point (2026-09-20).  Every point is the same incremental
# collection truncated, so the 6-demo checkpoint IS this curve's 6-demo point:
#    2: 0.010   4: 0.037   6: 0.770   8: 0.815   10: 0.900   12: 0.882
#
# The curve is BIMODAL, not a gradient: it jumps from 0.037 to 0.770 between 4
# and 6 demos, and demos are collected one per agent per round so odd counts do
# not exist.  6 is therefore the lowest teacher that functions at all -- there
# is no 0.25 or 0.5 teacher to be had by starving demonstrations, at any
# granularity.
#
# Why the cliff, and why the sub-6 teachers are not usable: under the legacy
# -1/step schema these same checkpoints scored -184.3 / -179.5 (2 / 4 demos),
# which reads as ~16-20 steps per episode spent inside the basin -- impossible
# if they reached the goal only 1-4% of the time.  Legacy scoring ignored
# collisions and this schema does not (reward() pays _success() & ~collided),
# so the sub-6 policies DO drive the ball to the goal and simply scrape the
# wire on the way.  Their proposals would be executed unconditionally during
# teacher warm-up, so a "weak" teacher chosen from below the cliff would be
# actively harmful rather than merely unhelpful.
#
# The legacy-unit curve this replaces (-184.3 / -179.5 / -167.3 / -165.1 /
# -132.2 / -133.6 at 2..12) ranked the same checkpoints differently because it
# scored how long the ball was HELD in the basin.  Under the binary schema the
# episode ends on arrival, so holding no longer exists and only arriving
# cleanly counts.  Do not compare the two sets of numbers.
r2bc_checkpoint_path: "teachers/buzz_wire/policy_checkpoint.pth"
demonstrations_path: "teachers/buzz_wire/demonstrations_binary.pt"

# 855 demo transitions (6 episodes, 4 of them reaching the goal) against 600k
# collected frames.  Navigation collects 300k against a 200k buffer, so its
# demos survive the first 67% of the run at a 1.2% fill fraction.  400k
# reproduces that survival fraction exactly (the ring wraps 400k frames in,
# i.e. iter 50/75 at 8k frames/iter).  The fill fraction is now 0.21%, half of
# what the 12-demo teacher gave -- but the SURVIVAL fraction, which is what
# this number sizes, is unaffected by how many demos there are.
ibmarl_replay_size: 400000

# --- Warm-up ----------------------------------------------------------------
# IBRL's warm-up (num_warm_up_episode): the teacher collects the first episodes
# before any RL update, so the arbiter's first decision is made by a critic that
# has seen the teacher succeed.  With the default (the untrained critic
# arbitrates the first batches) a coin flip decides the run here, because the RL
# actor alone never reaches the goal (MADDPG 0/5): buzzwire1 ibmarl_strict seeds
# 1 and 3 opened at 91% / 43% RL actions and sat at -200 for all 75 iterations,
# while the three seeds that opened below 30% RL all crossed the teacher.
#
# 40k frames = 5 iterations = 10% of the buffer, counted against the 600k
# budget.  UNCHANGED from the 12-demo teacher, and the weakening does not
# threaten it: successful episodes end at the goal (median arrival step 92 for
# this teacher, from the demo recording) and failures run the full 200, so 40k
# frames buys roughly 350 episodes of which ~270 succeed.  The 12-demo teacher
# gave ~470 episodes and ~410 successes -- less signal, same order, still far
# above the handful that decided buzzwire1's bad seeds.  Revisit this if the
# teacher is ever weakened past the point where most warm-up episodes fail.
ibmarl_warm_up_policy: teacher
ibmarl_min_warm_up_frames: 40000
