# Balance-specific overlay for RFT -- the same demos IBMARL and RLfD are given,
# used only for the BC regularizer.
#
# Without this file RFT cannot run on balance: rft.yaml's navigation demos are
# [N, 3, 18] and the balance actor takes a 16-dim observation, so
# _compute_bc_loss_for_group raises on the first BC update -- the failure
# rft_transport.yaml's header documents for transport.  rlfd_balance.yaml guards
# against exactly this; this is its twin.
#
# 36 episodes / 10,800 transitions, 3 agents, obs 16, act 2, relabelled to the
# gt-in-radius sparse schema by analysis/relabel_demos_sparse.py (the raw
# recording in teachers/balance/demonstrations.pt is dense).
demonstrations_path: "teachers/balance/demonstrations_sparse.pt"

# load_config merges this layer with a flat `config.update`, so naming `rft`
# here REPLACES rft.yaml's whole block -- bc_alpha has to be restated or it
# silently falls back to the 0.1 default in rft_experiment.py.
rft:
  bc_alpha: 0.1

  # ITERATION-indexed.  Annealed over the FULL run like buzz_wire (75/75) and
  # transport800 (800/800): the anchor reaches 0 only at the last iteration, so
  # RFT itself is what gets evaluated rather than its MADDPG tail.
  #
  # ****  TIED TO n_iters in config/environments/balance.yaml (500).  ****
  # If the budget moves, move this with it (paper_run --n-iters rescales it
  # proportionally for smoke tests).
  bc_anneal_n_iters: 500
