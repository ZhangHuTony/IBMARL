# Buzz-wire-specific overlay for RFT -- the same demos IBMARL bootstraps from,
# used only for the BC regularizer.
demonstrations_path: "teachers/buzz_wire/demonstrations_binary.pt"

# bc_anneal_n_iters is ITERATION-indexed, and buzz_wire runs 75 iterations, not
# navigation's 300 (rft.yaml's 150 would freeze the BC term at half strength for
# the whole run).  Annealed over the FULL run: the anchor reaches 0 only at the
# last iteration.  buzzwire4 used 37 (navigation's half-the-run ratio), which
# made RFT plain MADDPG for the last 51% of training; all 3 seeds then collapsed
# to 0 success (iterations 56/61/72) with the critic's Q past the schema's
# ceiling of 1 -- RFT was being scored on its MADDPG tail.  75 is the charitable
# reading of "linearly anneals to zero" and keeps RFT itself under evaluation.
# Comparable to buzzwire4's rft only with that caveat.
# NOTE: the per-scenario layer merges `training` key-by-key but plain-dict
# blocks are replaced wholesale (run_experiment.load_config:67), so bc_alpha
# has to be restated here or rft.yaml's value would be dropped.
rft:
  bc_alpha: 0.1
  bc_anneal_n_iters: 75
