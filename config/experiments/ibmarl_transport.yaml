# Transport-specific overlay for IBMARL.
# Merged on top of config/experiments/ibmarl.yaml by load_config, so everything not
# named here (strict/soft/temperature/num_critics/exploration_noise) keeps its default.

# Suboptimal heuristic teacher: 204 episodes, 122,400 transitions, dense rewards,
# delivers the package in 9.8% of episodes.
r2bc_checkpoint_path: "/home/tony-zhang/Research/R2BC/results/transport_r2bc_decent_20260821_154402/policy_checkpoint.pth"
demonstrations_path: "/home/tony-zhang/Research/R2BC/results/transport_r2bc_decent_20260821_154402/demonstrations.pt"

# 122,400 demo transitions.  Navigation collects 300k frames against a 200k buffer, so its
# demos survive to ~iter 200/300.  Transport collects 1.5M: at 200k the ring buffer wraps back
# onto the demos at ~iter 40/300 and erases them for 87% of the run.  At 1M the demos hold
# slots 0-122k, online data fills to capacity over ~175 iterations, and only then begins
# overwriting them -- restoring the navigation ratio.
ibmarl_replay_size: 1000000

# Two demo quirks that are deliberately NOT worked around, because this loader is immune:
#  * The demo buffer is 2-env interleaved (next_obs[t] == obs[t+2]).  That breaks loaders
#    which rebuild episodes from row adjacency, but _load_demonstrations_into_buffer treats
#    each row as a self-contained (obs, act, rew, next_obs) tuple, and next_obs[t] IS the
#    true successor of obs[t] within its own env stream.
#  * 'dones' is the package-on-goal flag, not a terminal flag (True mid-episode, never at the
#    horizon-600 boundaries).  It cannot reach the TD target: losses.py reads
#    ("next", group, "terminated"), which the loader sets to all-zeros.
